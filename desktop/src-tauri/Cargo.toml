[package]
name = "orquestrador"
version = "0.1.0"
description = "Orquestrador - autonomous multi-AI coordination desktop shell"
authors = ["Orquestrador"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix is required so the lib target name never collides with
# the `orquestrador` binary target -- this bites people on Windows if
# omitted (see https://github.com/rust-lang/cargo/issues/8519).
name = "orquestrador_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
